aid: 24m
name: 24M
description: '24M Technologies is a battery technology company founded in 2010 out of
  MIT laboratories and headquartered in Cambridge, Massachusetts. Rather than manufacturing
  cells at scale itself, 24M licenses its battery materials, cell architecture and SemiSolid
  manufacturing platform to energy-storage system integrators, EV battery manufacturers
  and OEMs worldwide. Its product portfolio spans the Eternalyte electrolyte (ultra-fast
  charging and low-temperature performance), the Impervio separator (thermal-runaway
  prevention), the LiForever electrode, the 24M ETOP electrode-to-pack architecture,
  and 24M production equipment. Partners and corporate investors have included Volkswagen
  Group, Kyocera, Itochu and FREYR Battery. 24M is a hardware, materials and manufacturing
  company; it publishes no public developer API, SDK or machine-readable API contract.'
